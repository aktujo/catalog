# SPDX-License-Identifier: MIT
# Every template valid and catalog.json up to date; the licence check (REUSE) and a sign-off (DCO) on every commit of
# a pull request, both from falkoss/starterpack, pinned by commit. Actions are pinned by commit, with the version as a
# comment.
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Every template valid, catalog.json up to date (the runner's Python 3.12)
      - run: python3 tools/catalog.py --check

  licences:
    uses: falkoss/starterpack/.github/workflows/reuse.yml@1e2fad7b6afb0f45f7d62d6a9472c97484ff4585
  sign-off:
    uses: falkoss/starterpack/.github/workflows/dco.yml@1e2fad7b6afb0f45f7d62d6a9472c97484ff4585
